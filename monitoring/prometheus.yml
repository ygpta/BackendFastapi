global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:8000]
    # For secured deployments mount /run/secrets/metrics_api_key and add:
    # http_headers:
    #   X-API-Key:
    #     files: [/run/secrets/metrics_api_key]
  - job_name: worker
    static_configs:
      - targets: [worker:9001]