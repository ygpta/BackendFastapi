[project]
name = "backendfastapi"
version = "0.1.0"
description = "Production-oriented FastAPI service with PostgreSQL and LangGraph chat."
readme = "README.md"
authors = [
    { name = "ygpta", email = "yatendraguptaofficial@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "sse-starlette>=3.0,<4.0",
    "tiktoken>=0.9,<1.0",
    "prometheus-client>=0.21,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "PyJWT>=2.10,<3.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1.0",
    "pip-audit>=2.9,<3.0",
    "pytest-cov>=6,<8",
    "pytest>=8,<10",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["postgres: integration tests requiring TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[project.scripts]
backendfastapi = "backendfastapi:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
